# Make the attached USB interface the default ALSA device inside the container.
#
# Why: Feishin's mpv "Audio device" dropdown can fall back to the generic
# "alsa (Default (alsa))" entry. Pointing the ALSA default at the interface
# means that option (and mpv's "auto") plays to the right hardware, and you
# don't depend on the per-device entries being enumerated.
#
# Change "Go" to your card name if you use a different interface
# (find it with:  cat /proc/asound/cards  — use the bracketed short name).
pcm.!default {
    type plug
    slave.pcm "hw:Go,0"
}
ctl.!default {
    type hw
    card Go
}
