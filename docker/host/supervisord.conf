; Supervisor config for the headless Feishin audio host.
; Starts (in order of priority): Xvfb -> openbox -> x11vnc -> noVNC -> Feishin.
; (Electron gets its own private session bus via dbus-run-session in
;  launch-feishin.sh, so there is no separate dbus program here.)

[supervisord]
nodaemon=true
user=root
loglevel=info

; --- virtual framebuffer ------------------------------------------------------
[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 %(ENV_SCREEN_RESOLUTION)s -ac -nolisten tcp
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; --- minimal window manager (so the Feishin window maximizes/behaves) ---------
[program:openbox]
command=/usr/bin/openbox
autorestart=true
priority=15
environment=DISPLAY=":99"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; --- VNC server bound to the virtual display ----------------------------------
[program:x11vnc]
command=/usr/bin/x11vnc -display :99 -forever -shared -rfbport 5900 -nopw -xkb -noxrecord -noxfixes -noxdamage
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; --- noVNC: browser access to the VNC session at :6080 ------------------------
[program:novnc]
command=/usr/bin/websockify --web=/usr/share/novnc 6080 localhost:5900
autorestart=true
priority=25
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; --- the Feishin Electron app (mpv audio engine) ------------------------------
[program:feishin]
command=/usr/local/bin/launch-feishin.sh
user=feishin
autorestart=true
priority=30
startsecs=5
environment=DISPLAY=":99",HOME="/home/feishin",FEISHIN_USER_DATA="/config",ELECTRON_DISABLE_SANDBOX="1"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
